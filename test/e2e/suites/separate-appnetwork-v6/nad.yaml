---
# Sysctl tuning NAD
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sysctl-tuning
spec:
  config: '{
      "cniVersion": "0.4.0",
      "name": "sysctl-tuning",
      "plugins": [
        {
          "type": "tuning",
          "prevResult": {},
          "sysctl": {
            "net.ipv4.conf.all.forwarding": "1",
            "net.ipv6.conf.all.forwarding": "1",
            "net.ipv4.fib_multipath_hash_policy": "1",
            "net.ipv6.fib_multipath_hash_policy": "1",
            "net.ipv4.conf.all.rp_filter": "2",
            "net.ipv4.conf.default.rp_filter": "2",
            "net.ipv4.fwmark_reflect": "1",
            "net.ipv6.fwmark_reflect": "1",
            "net.ipv4.ip_local_port_range": "49152 65535"
          }
        }
      ]
  }'
---
# BIRD router-id NAD (IPv4-only, dummy interface).
# On an IPv6-only cluster, BIRD cannot auto-derive a router ID (which is
# historically a 32-bit/IPv4-shaped value) since no interface has an IPv4
# address. This NAD gives the SLLBR pods a throwaway IPv4 address on a dummy
# interface purely so BIRD can pick a router ID; it is not used for any
# real traffic. See separate-appnetwork-v6/README.md (if present) for details.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: bird-router-id-v6
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "bird-router-id-v6",
      "plugins": [
        {
          "type": "dummy",
          "ipam": {
            "type": "whereabouts",
            "range": "169.254.254.0/24"
          }
        }
      ]
    }
---
# VLAN 1300 NAD for gw-v6a1 BGP peering (IPv6-only)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-1300
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "vlan",
      "master": "eth0",
      "vlanId": 1300,
      "ipam": {
        "type": "whereabouts",
        "ipRanges": [
          { "range": "fd00:cafe:70::/64", "exclude": ["fd00:cafe:70::150/128"] }
        ]
      }
    }
---
# VLAN 1400 NAD for gw-v6a2 BGP peering (IPv6-only)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-1400
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "vlan",
      "master": "eth0",
      "vlanId": 1400,
      "ipam": {
        "type": "whereabouts",
        "ipRanges": [
          { "range": "fd00:cafe:71::/64", "exclude": ["fd00:cafe:71::150/128"] }
        ]
      }
    }
---
# App network for gw-v6a1 (IPv6-only, SLLBR ↔ app Pods)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: app-net-v6a1
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "app-net-v6a1",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0",
          "mode": "bridge",
          "ipam": {
            "type": "whereabouts",
            "ipRanges": [
              { "range": "fd00:cafe:170::/64" }
            ]
          }
        }
      ]
    }
---
# App network for gw-v6a2 (IPv6-only, separate from gw-v6a1)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: app-net-v6a2
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "app-net-v6a2",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0",
          "mode": "bridge",
          "ipam": {
            "type": "whereabouts",
            "ipRanges": [
              { "range": "fd00:cafe:170::/64" }
            ]
          }
        }
      ]
    }
