---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-bfd
spec:
  gatewayClassName: meridio
  infrastructure:
    parametersRef:
      group: meridio-2.nordix.org
      kind: GatewayConfiguration
      name: gwconfig-bfd
  listeners:
  - name: default
    protocol: TCP
    port: 80
---
apiVersion: meridio-2.nordix.org/v1alpha1
kind: GatewayConfiguration
metadata:
  name: gwconfig-bfd
spec:
  networkAttachments:
  - type: NAD
    nad:
      name: sysctl-tuning
      namespace: e2e-bfd-detection
      interface: dummy
  - type: NAD
    nad:
      name: vlan-1500
      namespace: e2e-bfd-detection
      interface: vlan-1500
  - type: NAD
    nad:
      name: app-net-bfd
      namespace: e2e-bfd-detection
      interface: net-bfd
  internalSubnets:
  - attachmentType: NAD
    cidr: "169.111.80.0/24"
  horizontalScaling:
    replicas: 1
