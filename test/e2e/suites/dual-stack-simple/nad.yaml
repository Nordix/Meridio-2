---
# Sysctl tuning NAD
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sysctl-tuning
spec:
  config: '{
      "cniVersion": "0.4.0",
      "name": "sysctl-tuning",
      "plugins": [
        {
          "type": "tuning",
          "prevResult": {},
          "sysctl": {
            "net.ipv4.conf.all.forwarding": "1",
            "net.ipv6.conf.all.forwarding": "1",
            "net.ipv4.fib_multipath_hash_policy": "1",
            "net.ipv6.fib_multipath_hash_policy": "1",
            "net.ipv4.conf.all.rp_filter": "2",
            "net.ipv4.conf.default.rp_filter": "2",
            "net.ipv4.fwmark_reflect": "1",
            "net.ipv6.fwmark_reflect": "1",
            "net.ipv4.ip_local_port_range": "49152 65535"
          }
        }
      ]
  }'
---
# VLAN 700 NAD for dual-stack BGP peering (reuses ipv4-simple VLAN slot)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-700
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "vlan",
      "master": "eth0",
      "vlanId": 700,
      "ipam": {
        "type": "whereabouts",
        "ipRanges": [
          { "range": "169.254.40.0/24", "exclude": ["169.254.40.150/32"] },
          { "range": "fd00:cafe:40::/64", "exclude": ["fd00:cafe:40::150/128"] }
        ]
      }
    }
---
# Dual-stack app network
# IPv6 uses fd00:cafe:140::/64 (internal) to avoid conflict with
# fd00:cafe:40::/64 (external/VLAN). Mirrors IPv4 pattern:
#   external 169.254.40.x vs internal 169.111.40.x
#   external fd00:cafe:40::x vs internal fd00:cafe:140::x
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: app-net-ds
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "app-net-ds",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0",
          "mode": "bridge",
          "ipam": {
            "type": "whereabouts",
            "ipRanges": [
              { "range": "169.111.40.0/24" },
              { "range": "fd00:cafe:140::/64" }
            ]
          }
        }
      ]
    }
