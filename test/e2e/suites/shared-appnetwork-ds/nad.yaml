---
# Sysctl tuning NAD
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sysctl-tuning
spec:
  config: '{
      "cniVersion": "0.4.0",
      "name": "sysctl-tuning",
      "plugins": [
        {
          "type": "tuning",
          "prevResult": {},
          "sysctl": {
            "net.ipv4.conf.all.forwarding": "1",
            "net.ipv6.conf.all.forwarding": "1",
            "net.ipv4.fib_multipath_hash_policy": "1",
            "net.ipv6.fib_multipath_hash_policy": "1",
            "net.ipv4.conf.all.rp_filter": "2",
            "net.ipv4.conf.default.rp_filter": "2",
            "net.ipv4.fwmark_reflect": "1",
            "net.ipv6.fwmark_reflect": "1",
            "net.ipv4.ip_local_port_range": "49152 65535"
          }
        }
      ]
  }'
---
# VLAN 300 NAD for gw-bds1 BGP peering (dual-stack; reuses shared-appnetwork VLAN)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-300
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "vlan",
      "master": "eth0",
      "vlanId": 300,
      "ipam": {
        "type": "whereabouts",
        "ipRanges": [
          { "range": "169.254.20.0/24", "exclude": ["169.254.20.150/32"] },
          { "range": "fd00:cafe:20::/64", "exclude": ["fd00:cafe:20::150/128"] }
        ]
      }
    }
---
# VLAN 400 NAD for gw-bds2 BGP peering (dual-stack; reuses shared-appnetwork VLAN)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-400
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "vlan",
      "master": "eth0",
      "vlanId": 400,
      "ipam": {
        "type": "whereabouts",
        "ipRanges": [
          { "range": "169.254.21.0/24", "exclude": ["169.254.21.150/32"] },
          { "range": "fd00:cafe:21::/64", "exclude": ["fd00:cafe:21::150/128"] }
        ]
      }
    }
---
# Shared dual-stack app network for both gw-bds1 and gw-bds2.
# IPv6 uses fd00:cafe:120::/64 (internal) to avoid conflict with the
# external/VLAN ranges fd00:cafe:20::/64 and fd00:cafe:21::/64.
# Mirrors the IPv4 pattern: external 169.254.2x.x vs internal 169.111.20.x
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: app-net-bds
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "app-net-bds",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0",
          "mode": "bridge",
          "ipam": {
            "type": "whereabouts",
            "ipRanges": [
              { "range": "169.111.20.0/24" },
              { "range": "fd00:cafe:120::/64" }
            ]
          }
        }
      ]
    }
