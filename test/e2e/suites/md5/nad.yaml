---
# Sysctl tuning NAD
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sysctl-tuning
spec:
  config: '{
      "cniVersion": "0.4.0",
      "name": "sysctl-tuning",
      "plugins": [
        {
          "type": "tuning",
          "prevResult": {},
          "sysctl": {
            "net.ipv4.conf.all.forwarding": "1",
            "net.ipv6.conf.all.forwarding": "1",
            "net.ipv4.fib_multipath_hash_policy": "1",
            "net.ipv6.fib_multipath_hash_policy": "1",
            "net.ipv4.conf.all.rp_filter": "2",
            "net.ipv4.conf.default.rp_filter": "2",
            "net.ipv4.fwmark_reflect": "1",
            "net.ipv6.fwmark_reflect": "1"
          }
        }
      ]
  }'
---
# VLAN 1400 NAD for gw-md1 BGP peering (MD5 suite, deprecated RFC2385)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-1400
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "vlan",
      "master": "eth0",
      "vlanId": 1400,
      "ipam": {
        "type": "whereabouts",
        "ipRanges": [
          { "range": "169.254.80.0/24", "range_start": "169.254.80.1", "range_end": "169.254.80.2", "exclude": ["169.254.80.150/32"] }
        ]
      }
    }
---
# VLAN 1500 NAD for gw-md2 BGP peering (MD5 suite, deprecated RFC2385)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-1500
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "vlan",
      "master": "eth0",
      "vlanId": 1500,
      "ipam": {
        "type": "whereabouts",
        "ipRanges": [
          { "range": "169.254.81.0/24", "range_start": "169.254.81.1", "range_end": "169.254.81.2", "exclude": ["169.254.81.150/32"] }
        ]
      }
    }
---
# Shared app network for both gw-md1 and gw-md2
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: app-net-md
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "app-net-md",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0",
          "mode": "bridge",
          "ipam": {
            "type": "whereabouts",
            "ipRanges": [
              { "range": "169.111.80.0/24" }
            ]
          }
        }
      ]
    }
