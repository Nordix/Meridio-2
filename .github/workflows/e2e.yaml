---
name: e2e

on:
  workflow_call:
    secrets:
      HARBOR_REGISTRY:
        required: true
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true

  workflow_dispatch:

env:
  KIND_VERSION: v0.27.0

# NOTE: the runner image is pinned to ubuntu-24.04 instead of ubuntu-latest.
#
# The e2e data path runs on the *host* kernel and Docker daemon: Kind nodes are
# containers, and nfqueue/nftables (nfqlb), MACVLAN/SBR secondary networking and
# the breakout bridge all use host netfilter. When ubuntu-latest migrated to
# Ubuntu 26.04 (see actions/runner-images#14748), unchanged commits that had been
# fully green started failing the ipv4 and dual-stack suites, while the ipv6 ones
# kept passing.
#
# On 26.04 the control plane stays healthy (Gateways Programmed, ENCs Ready,
# complete nfqlb Maglev tables) and ICMP to the VIP works, but TCP/UDP through
# the LB is black-holed for affected VIP:port pairs.
#
# Pinning is a stopgap: ubuntu-latest finishes migrating to 26.04 in Dec 2026,
# so the underlying 26.04 incompatibility still has to be found and fixed.
jobs:
  get-tag:
    name: Get tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.get-tag-step.outputs.tag }}
    steps:
      - name: Get tag
        id: get-tag-step
        run: |
          branch="${{ github.ref_name }}"

          if [[ "$branch" == release/* ]]; then
            tag="${branch#release/}"
          elif [[ "$branch" == "master" ]]; then
            tag="latest"
          else
            tag="$branch"
          fi

          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "Using tag: $tag"

  build-and-push:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: get-tag
    strategy:
      matrix:
        image:
          - controller-manager
          - stateless-load-balancer
          - router
          - network-sidecar
          - example-target
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - run: make ${{ matrix.image }} REGISTRY=${{ secrets.HARBOR_REGISTRY }}/cloud-native/meridio-2 VERSION=${{ needs.get-tag.outputs.tag }} BUILD_STEPS="build tag push"

  e2e:
    runs-on: ubuntu-24.04
    needs: [get-tag, build-and-push]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ipv4
          - dual-stack
          - ipv6
        k8s_version:
          - v1.32.2
          - v1.31.6
        include:
          - k8s_version: v1.32.2
            image: v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
          - k8s_version: v1.31.6
            image: v1.31.6@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87
          - suite: ipv4
            kind_config: test/e2e/kind-cluster/kind.yaml
          - suite: dual-stack
            kind_config: test/e2e/kind-cluster/kind.yaml
          - suite: ipv6
            kind_config: test/e2e/kind-cluster/kind-ipv6.yaml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: kindest/node:${{ matrix.image }}
          cluster_name: kind
          config: ${{ matrix.kind_config }}
      - name: Check cluster
        run: |
          kubectl version
          kubectl cluster-info
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Setup cluster dependencies
        run: |
          make -C test/e2e cluster
          docker ps
          kubectl get all -A -o wide
      - name: Pre-pull images into Kind nodes
        run: |
          REGISTRY=${{ secrets.HARBOR_REGISTRY }}/cloud-native/meridio-2
          TAG=${{ needs.get-tag.outputs.tag }}
          for img in controller-manager stateless-load-balancer router network-sidecar example-target; do
            docker pull ${REGISTRY}/${img}:${TAG}
            kind load docker-image ${REGISTRY}/${img}:${TAG} --name kind
          done
      - name: Deploy ${{ matrix.suite }} suites
        run: |
          make -C test/e2e deploy-${{ matrix.suite }} REGISTRY=${{ secrets.HARBOR_REGISTRY }}/cloud-native/meridio-2 VERSION=${{ needs.get-tag.outputs.tag }}
          kubectl get all -A -o wide
      - name: Diagnose deployment issues
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods -A
          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep '^e2e-'); do
              echo -e "\n\n########### SCOPE: NAMESPACE $ns ###########"
              kubectl get events -n "$ns" --sort-by='.lastTimestamp'
              kubectl logs -n "$ns" -l control-plane=controller-manager --all-containers --prefix --tail=100 2>/dev/null || true
              kubectl logs -n "$ns" -l app --all-containers --prefix --tail=100 2>/dev/null || true
          done
      - name: Run ${{ matrix.suite }} tests
        run: make -C test/e2e test-${{ matrix.suite }} REGISTRY=${{ secrets.HARBOR_REGISTRY }}/cloud-native/meridio-2 VERSION=${{ needs.get-tag.outputs.tag }} GINKGO_FLAGS="--junit-report=junit-${{ matrix.suite }}-${{ matrix.k8s_version }}.xml"
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.suite }}-${{ matrix.k8s_version }}
          path: test/e2e/junit-*.xml
          if-no-files-found: warn
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Test Results (${{ matrix.suite }}, ${{ matrix.k8s_version }})
          path: test/e2e/junit-*.xml
          reporter: java-junit
